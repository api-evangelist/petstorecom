name: Petstore.com
description: >-
  Petstore.com is an online pet-supplies store built on Shopify that exposes a
  first-class agent commerce surface. Alongside the human storefront it implements
  the Universal Commerce Protocol (UCP) over the Model Context Protocol (MCP) at
  /api/ucp/mcp, publishes a /.well-known/ucp merchant profile and a /agents.md
  (mirrored as /llms.txt) describing how AI agents can search the catalog, build a
  cart, and drive a buyer-approved checkout. Buyer identity uses Shopify Customer
  Account OpenID Connect, payment is handled by Google Pay and Shopify card
  handlers, and every checkout requires contemporaneous human approval. Read-only
  storefront browsing (products, collections, search, sitemap) needs no auth. Added
  to the API Evangelist network as a Battery Ventures portfolio lead; enriched from
  the store's live agent-facing surface.
