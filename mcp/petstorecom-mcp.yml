generated: '2026-07-20'
method: searched
status: published
source: https://petstore.com/agents.md
discovery: https://petstore.com/.well-known/ucp
server:
  name: petstorecom-ucp
  description: Petstore.com's agent-facing commerce endpoint, implemented via the Universal Commerce Protocol
    (UCP) over MCP. Lets agents search the catalog, build a cart, and drive a buyer-approved checkout
    on this Shopify store. Payment always requires contemporaneous human approval.
  transport: http
  url: https://petstore.com/api/ucp/mcp
  canonical_url: https://petstoredotcom.myshopify.com/api/ucp/mcp
  protocol: ucp
  ucp_versions:
  - '2026-04-08'
  - '2026-01-23'
  spec: https://ucp.dev/2026-04-08/specification/overview/
  auth:
    note: tools/list and tool calls require a UCP agent-profile URI; unauthenticated probes return -32001
      "UCP discovery failed / Missing profile uri". Buyer identity uses Shopify Customer Account OIDC
      (see well-known/openid-configuration).
    oidc: https://petstore.com/.well-known/openid-configuration
  rate_limited: true
capabilities:
- dev.ucp.shopping.catalog.search
- dev.ucp.shopping.catalog.lookup
- dev.ucp.shopping.cart
- dev.ucp.shopping.checkout
- dev.ucp.shopping.fulfillment
- dev.ucp.shopping.discount
- dev.ucp.shopping.order
- dev.shopify.catalog
payment_handlers:
- com.google.pay
- dev.shopify.card
tools:
- name: search_catalog
  description: Find products matching the buyer's intent (UCP catalog.search)
  source: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
- name: create_cart
  description: Add desired items to a cart (UCP cart)
  source: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
- name: create_checkout
  description: Start the purchase flow (UCP checkout)
  source: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
- name: update_checkout
  description: Set shipping address and method (UCP fulfillment)
  source: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
- name: complete_checkout
  description: Finalize the purchase — buyer must approve payment (UCP checkout)
  source: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
notes: Tool names captured from the provider's published /agents.md and /llms.txt and the UCP shopping
  service schema. The live endpoint gates tools/list behind a UCP agent profile, so schemas were not enumerated
  directly.
